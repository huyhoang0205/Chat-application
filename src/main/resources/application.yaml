spring:
    config:
        import: optional:file:.env
    application:
        name: CHAT_APP
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                type:
                    json_format_mapper: com.huyhoang25.chatapp.configuration.CustomHibernateJsonFormatter
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD}
            ssl:
                enabled: true
jwt:
    secret-key: 91eedeb7e798938acd57a0326e341e9709987f4d303f45c83ea7bccabf3c0bbb
logging:
    level:
        org:
            springframework:
                security: INFO
            web:
                socket: INFO
app:
    frontend_origin: ${FRONTEND_ORIGIN}
